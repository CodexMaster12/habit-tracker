<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Habit Tracker</title>
</head>

<body>
    <main class="container">
        <header>
            <h1>Habit Tracker</h1>
            <p>Acompanhe sua evolução e mantenha a constância.</p>
        </header>

        <section class="form-habito">
            <h2>Adicionar hábito</h2>

            <label for="nome-habito">Nome do hábito</label>
            <input
                type="text"
                id="nome-habito"
                placeholder="Ex.: Refrigerante"
            >

            <label for="data-inicio">Data de início</label>
            <input
                type="date"
                id="data-inicio"
            >

            <label for="hora-inicio">Horário de início</label>
            <input
                type="time"
                id="hora-inicio"
            >

            <div class="acoes-formulario">
                <button
                    type="button"
                    id="botao-adicionar"
                >
                    Adicionar hábito
                </button>

                <button
                    type="button"
                    id="botao-cancelar"
                    class="oculto"
                >
                    Cancelar edição
                </button>
            </div>
        </section>

        <section id="lista-habitos"></section>

        <div id="estado-vazio">
            <h2>🎉</h2>
            <p>Nenhum hábito cadastrado.</p>
            <small>Adicione seu primeiro hábito para começar.</small>
        </div>
    </main>

    <div
        id="modal-confirmacao"
        class="modal oculto"
    >
        <div class="modal-conteudo">
            <h2>Reiniciar contador?</h2>

            <p id="mensagem-modal">
                Essa ação vai alterar a data de início do hábito.
            </p>

            <div class="modal-acoes">
                <button
                    type="button"
                    id="btn-cancelar-modal"
                    class="btn-cancelar"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btn-confirmar-modal"
                    class="btn-confirmar"
                >
                    Reiniciar
                </button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
