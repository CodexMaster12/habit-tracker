<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Habit Tracker</title>
</head>
<body>
    <main class="container">
        <section class="form-habito">
            <h2>Adicionar hábito</h2>

            <label for="nome-habito">Nome do hábito</label>
            <input
                type="text"
                id="nome-habito"
                placeholder="Ex.: Refrigerante"
            >

            <label for="data-inicio">Data de início</label>
            <input
                type="date"
                id="data-inicio"
            >

            <label for="hora-inicio">Horário de início</label>
            <input
                type="time"
                id="hora-inicio"
            >

            <button id="botao-adicionar">
                Adicionar hábito
            </button>
        </section>
        <header>
            <h1>Habit Tracker</h1>
            <p>Acompanhe sua evolução e mantenha a constância.</p>
        </header>

        <section id="lista-habitos"></section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
